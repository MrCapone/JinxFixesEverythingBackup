<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="favicon.png">    
    <title>Jinx Fixes Everything</title>
    <style>
	:root {
            --jinx-main: #04A9EB;
            --jinx-cyan: #00f2ff;
	    --jinx-pink: #ff00ea;
            --firelight: #a6ff00;
            --jinx-dark: #0a0c10;
            --jinx-bg: #05070a;
            --jinx-border: #1e2329;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; 
        }

	#menu {
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            width: 100%; 
            height: 100%; 
            position: absolute; 
            z-index: 10;
            background: radial-gradient(circle at center, #0d1a25 0%, #05070a 100%);
        }

	.launcher {
            background: rgba(13, 17, 23, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--jinx-main);
            text-align: center;
            width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

	.main-logo {
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            border-radius: 8px;
            filter: none;
        }

        select {
            width: 100%; padding: 14px; margin: 10px 0;
            border-radius: 8px; border: 1px solid var(--jinx-border);
            background: #0d1117; color: #fff; font-size: 16px;
            outline: none; transition: 0.3s;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 1em;
        }

        select:focus { 
            border-color: var(--jinx-main); 
            box-shadow: 0 0 12px rgba(4, 169, 235, 0.3); 
        }

	/* Act 1: Arcade (Cyan) */
	.btn {
            width: 100%; padding: 15px; margin: 12px 0;
            border-radius: 8px; border: 1px solid var(--jinx-cyan);
            background: rgba(4, 169, 235, 0.05); color: var(--jinx-cyan);
            cursor: pointer; font-weight: bold; text-transform: uppercase;
            transition: all 0.25s ease-out; 
            display: block; text-decoration: none;
            box-sizing: border-box;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--jinx-cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(4, 169, 235, 0.4);
            transform: translateY(-2px);
        }

	/* Act 2: The Last Drop (Pink) */
        .btn-act2 { 
            border-color: var(--jinx-pink); 
            color: var(--jinx-pink); 
            background: rgba(255, 0, 234, 0.05); 
        }
        .btn-act2:hover { 
            background: var(--jinx-pink); 
            color: #fff; 
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.4); 
        }

        /* Act 3: Firelight (Green) */
        .btn-act3 { 
            border-color: var(--firelight); 
            color: var(--firelight); 
            background: rgba(166, 255, 0, 0.05); 
        }
        .btn-act3:hover { 
            background: var(--firelight); 
            color: #000; 
            box-shadow: 0 0 20px rgba(166, 255, 0, 0.4); 
        }

        #game-container { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 100; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
    </style>
</head>
<body>
    <div id="menu">
        <div class="launcher">
            <img src="logo.jpg" alt="Jinx Fixes Everything" class="main-logo">
            <select id="locale">
                <option value="en-us">English (US)</option>
                <option value="en-gb">English (UK)</option>
                <option value="fr-fr">Français (France)</option>
                <option value="de-de">Deutsch (Germany)</option>
                <option value="it-it">Italiano (Italy)</option>
                <option value="es-es">Español (Europe)</option>
                <option value="pl-pl">Polski (Poland)</option>
                <option value="cs-cz">Čeština (Czech)</option>
                <option value="hu-hu">Magyar (Hungary)</option>
                <option value="ro-ro">Română (Romania)</option>
                <option value="ru-ru">Русский (Russian)</option>
                <option value="el-gr">Ελληνικά (Greece)</option>
                <option value="zh-cn">简体中文 (Simplified)</option>
                <option value="zh-tw">繁體中文 (Traditional)</option>
                <option value="ja-jp">日本語 (Japan)</option>
                <option value="ko-kr">한국어 (Korea)</option>
                <option value="th-th">ไทย (Thailand)</option>
                <option value="vi-vn">Tiếng Việt (Vietnam)</option>
                <option value="en-sg">English (Singapore)</option>
                <option value="en-ph">English (Philippines)</option>
                <option value="pt-br">Português (Brazil)</option>
                <option value="es-mx">Español (Mexico)</option>
                <option value="es-ar">Español (Argentina)</option>
                <option value="tr-tr">Türkçe (Turkey)</option>
                <option value="ar-ae">العربية (UAE)</option>
            </select>
		<div style="margin-top: 20px;">
                <div class="btn" onclick="launch('arcade.html')">Act 1: Arcade</div>
                <div class="btn btn-act2" onclick="launch('lastdrop.html')">Act 2: The Last Drop</div>
                <div class="btn btn-act3" onclick="launch('firelight.html')">Act 3: Firelight</div>
            </div>
        </div>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="" allow="fullscreen"></iframe>
    </div>

    <script>
        const supportedLocales = [
            'ru-ru', 'en-us', 'en-gb', 'fr-fr', 'de-de', 'it-it', 'es-es', 
            'pl-pl', 'cs-cz', 'hu-hu', 'ro-ro', 'el-gr', 'zh-cn', 'zh-tw', 
            'ja-jp', 'ko-kr', 'th-th', 'vi-vn', 'en-sg', 'en-ph', 'pt-br', 
            'es-mx', 'es-ar', 'tr-tr', 'ar-ae'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const localeSelect = document.getElementById('locale');
            let savedLocale = localStorage.getItem('jinx_preferred_locale');

            if (!savedLocale) {
                const browserLang = navigator.language.toLowerCase();
                savedLocale = supportedLocales.find(loc => 
                    loc === browserLang || loc.startsWith(browserLang.split('-')[0])
                ) || 'en-us';
            }
            localeSelect.value = savedLocale;
        });

        function launch(page) {
            const localeSelect = document.getElementById('locale');
            const loc = localeSelect.value;
            localStorage.setItem('jinx_preferred_locale', loc);

            const menu = document.getElementById('menu');
            const container = document.getElementById('game-container');
            const frame = document.getElementById('game-frame');

            frame.onload = () => {
                try {
                   const currentPath = frame.contentWindow.location.pathname;

                   // If the iframe navigated to a locale path or root, close it
                   if (supportedLocales.some(loc => currentPath.includes(loc)) || currentPath === '/') {
                       exitGame();
                   }
                } catch (e) {
                    // If we hit a Cross-Origin error or a 404, it usually means
                    // the game tried to navigate away. Treat this as an "Exit".
                    exitGame();
                }
            };

            const docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen().catch(e => {
                    console.warn("Fullscreen request denied:", e);
                });
            }

            menu.style.display = 'none';
            container.style.display = 'block';
            frame.src = page + "?locale=" + loc;
        }

        function exitGame() {
            const menu = document.getElementById('menu');
            const container = document.getElementById('game-container');
            const frame = document.getElementById('game-frame');

            container.style.display = 'none';
            menu.style.display = 'flex';
            frame.src = "about:blank"; // Kill the WebGL instance to free RAM

            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
